<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#9D174D">
  <meta name="description" content="Alexandra Barros - Clínica de Estética 40+">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alexandra Barros">
  
  <link rel="icon" type="image/png" href="icon-96.png" sizes="96x96" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  
  <title>Alexandra Barros - App Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --cor-fundo: #FFF2F6;
      --cor-card: #FFFFFF;
      --cor-principal: #9D174D;
      --cor-principal-escura: #6B0F34;
      --cor-dourada: #D4AF37;
      --cor-texto: #2D2424;
      --cor-mutado: #7A686E;
      --cor-borda: rgba(157, 23, 77, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #E8DCE0;
      color: var(--cor-texto);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      background-color: var(--cor-fundo);
      min-height: 100vh;
      position: relative;
      padding-bottom: 95px;
      box-shadow: 0 0 30px rgba(0,0,0,0.08);
    }

    /* HEADER PREMIUM BORDÔ & DOURADO */
    .app-header {
      background: linear-gradient(135deg, var(--cor-principal), var(--cor-principal-escura));
      padding: 20px 18px 24px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      box-shadow: 0 6px 20px rgba(157, 23, 77, 0.25);
    }

    .brand-box { display: flex; align-items: center; gap: 12px; }
    .avatar-ab {
      width: 42px; height: 42px; border-radius: 50%;
      background: #fff; color: var(--cor-principal);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px;
      border: 2px solid var(--cor-dourada);
    }
    .header-title {
      font-family: 'Playfair Display', serif;
      color: var(--cor-dourada);
      font-size: 20px;
      line-height: 1.1;
    }
    .header-sub { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 2px; }

    .header-badges { display: flex; align-items: center; gap: 8px; }
    .badge-vip {
      background: linear-gradient(135deg, #F5D061, #D4AF37);
      color: #3A2500; font-size: 11px; font-weight: 700;
      padding: 5px 10px; border-radius: 20px; display: none; align-items: center; gap: 4px;
    }
    .btn-admin-top {
      background: #1E293B; color: var(--cor-dourada);
      border: 1px solid var(--cor-dourada); padding: 6px 12px;
      border-radius: 20px; font-size: 11px; font-weight: 700;
      cursor: pointer; display: none; align-items: center; gap: 5px;
    }

    /* CONTEÚDO E ABAS */
    .content { padding: 18px; }
    .tela { display: none; animation: fadeIn 0.25s ease; }
    .tela.ativa { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .card {
      background: var(--cor-card);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--cor-borda);
      box-shadow: 0 4px 15px rgba(157, 23, 77, 0.05);
    }

    /* BANNER VITRINE */
    .vitrine-banner {
      background: linear-gradient(135deg, #B91C1C, #4C0519);
      border-radius: 20px; padding: 22px 16px; text-align: center;
      color: #fff; margin-bottom: 18px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 8px 20px rgba(157, 23, 77, 0.2);
    }
    .vitrine-banner h2 {
      font-family: 'Playfair Display', serif;
      color: var(--cor-dourada); font-size: 21px; letter-spacing: 1px; margin-bottom: 6px;
    }
    .vitrine-banner p { font-size: 11px; opacity: 0.92; font-weight: 500; }

    /* BARRA DE XP */
    .xp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .xp-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--cor-principal); letter-spacing: 0.8px; }
    .xp-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--cor-texto); }
    .xp-score { font-size: 22px; font-weight: 700; color: var(--cor-principal); text-align: right; }
    .xp-score small { display: block; font-size: 11px; color: var(--cor-mutado); font-weight: 500; }
    .xp-bar-bg { width: 100%; height: 10px; background: #F5E1E8; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--cor-principal), var(--cor-dourada)); border-radius: 10px; transition: width 0.5s ease; width: 6%; }
    .xp-desc { font-size: 12px; color: var(--cor-mutado); line-height: 1.4; }

    /* ATALHOS RÁPIDOS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .quick-card {
      background: #fff; border-radius: 16px; padding: 16px;
      border: 1px solid var(--cor-borda); text-align: left;
      cursor: pointer; transition: transform 0.15s;
      box-shadow: 0 3px 10px rgba(0,0,0,0.03);
    }
    .quick-card:active { transform: scale(0.97); }
    .quick-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: #FFF0F5; color: var(--cor-principal);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 10px;
    }
    .quick-card.vip-card { background: linear-gradient(135deg, #FFFDF7, #FEF3C7); border-color: #FCD34D; }
    .quick-card.vip-card .quick-icon { background: #FDE68A; color: #92400E; }
    .quick-card h4 { font-size: 14px; font-weight: 700; color: var(--cor-texto); }
    .quick-card p { font-size: 11px; color: var(--cor-mutado); margin-top: 3px; }

    /* BOTÕES E INPUTS */
    .btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, var(--cor-principal), var(--cor-principal-escura)); color: #fff; box-shadow: 0 4px 12px rgba(157, 23, 77, 0.25); }
    .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; }
    .btn-vip { background: linear-gradient(135deg, #D4AF37, #AA8220); color: #fff; }
    .btn-outline { background: #fff; color: var(--cor-texto); border: 1px solid #DDD; }
    .btn-sm { width: auto; padding: 9px 14px; font-size: 12px; border-radius: 10px; }

    .section-title {
      font-size: 12px; color: var(--cor-principal); text-transform: uppercase;
      font-weight: 700; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .section-title::before { content: ""; width: 4px; height: 15px; background: var(--cor-principal); border-radius: 2px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--cor-texto); }
    .form-control {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid #E2CED5; font-family: inherit; font-size: 13px; background: #fff;
    }

    /* ITENS DE LOJA E CURSOS */
    .item-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .item-info h4 { font-size: 14px; font-weight: 700; }
    .item-info p { font-size: 12px; color: var(--cor-mutado); margin-top: 3px; }
    .item-price { font-size: 16px; font-weight: 700; color: var(--cor-principal); margin-top: 6px; display: inline-block; }
    .old-price { font-size: 12px; text-decoration: line-through; color: #999; margin-left: 6px; }

    /* MENU INFERIOR FIXO */
    .nav-bottom {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: #fff;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 10px 0 12px; z-index: 50;
    }
    .nav-item {
      background: none; border: none; color: var(--cor-mutado);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--cor-principal); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- TOPO -->
  <header class="app-header">
    <div class="brand-box">
      <div class="avatar-ab">AB</div>
      <div>
        <h1 class="header-title">Alexandra Barros</h1>
        <p id="user-greeting" class="header-sub">Clínica de Estética 40+</p>
      </div>
    </div>
    <div class="header-badges">
      <span id="vip-badge" class="badge-vip"><i class="fa-solid fa-crown"></i> VIP</span>
      <button id="btn-admin-mode" onclick="mudarTela('admin')" class="btn-admin-top">
        <i class="fa-solid fa-shield-halved"></i> Gestão
      </button>
