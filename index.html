  <style>
    :root {
      --cor-fundo: #FFF2F6; --cor-card-fundo: #FFFFFF; --cor-principal: #9D174D;
      --cor-dourada: #D4AF37; --cor-texto-escuro: #333333; --cor-texto-mutado: #777777;
      --cor-whatsapp: #25D366; --cor-instagram: #E4405F; --cor-canal: #128C7E; --cor-email: #333333;
      --cor-header: #9D174D; --cor-nav: #9D174D; --cor-chat: #9D174D; --cor-sidebar: #9D174D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Montserrat', sans-serif; background-color: #E8DCE0; color: var(--cor-texto-escuro); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
    .app-container { width: 100%; max-width: 100vw; background-color: var(--cor-fundo); min-height: 100vh; position: relative; display: flex; flex-direction: column; transition: background 0.3s; background-size: cover; background-position: center; }
    .app-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
    .tela { display: none; }
    .tela.ativa { display: block; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .app-header { background-color: var(--cor-header); padding: 20px 16px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .avatar-ab { background-color: #FFFFFF; color: var(--cor-principal); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; overflow: hidden; }
    .avatar-ab img { width: 100%; height: 100%; object-fit: cover; }
    .header-title { font-family: 'Playfair Display', serif; color: var(--cor-dourada); font-size: 20px; font-weight: 700; text-align: left; }

    .nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid rgba(0,0,0,0.05); display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 0; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--cor-texto-mutado); font-size: 10px; font-weight: 600; gap: 4px; background: none; border: none; cursor: pointer; }
    .nav-item.active { color: var(--cor-nav, var(--cor-principal)); }
    .nav-item i { font-size: 18px; }
    .nav-side { display: none; }

    .welcome-banner { background: #fff; border: 1.5px solid var(--cor-dourada); border-radius: 12px; padding: 12px; margin-bottom: 16px; text-align: center; font-weight: 700; color: var(--cor-principal); font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: none; }
    .vitrine-banner-nova { background: linear-gradient(135deg, var(--grad-vitrine-start, #B91C1C), var(--grad-vitrine-end, #4C0519)); border-radius: 20px; padding: 24px 18px; text-align: center; color: #FFFFFF; margin-bottom: 24px; box-shadow: 0 6px 18px rgba(157, 23, 77, 0.2); }
    .vitrine-banner-nova h2 { font-size: 22px; color: var(--cor-dourada); margin-bottom: 6px; font-weight: 700; letter-spacing: 1.5px; }
    .vitrine-banner-nova p { font-size: 11px; opacity: 0.92; font-weight: 600; letter-spacing: 1px; }
    .quick-apps-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .quick-app { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--cor-texto-escuro); font-size: 10px; font-weight: 600; padding: 10px 4px; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04); cursor: pointer; }
    .quick-app-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 19px; }

    .section-title-nova { font-size: 13px; color: var(--cor-principal); text-transform: uppercase; font-weight: 700; margin: 28px 0 14px 0; display: flex; align-items: center; gap: 8px; }
    .section-title-nova::before { content: ""; display: inline-block; width: 4px; height: 16px; background-color: var(--cor-principal); border-radius: 2px; }

    .cta-topo-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
    .cta-topo-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 18px 12px; border-radius: 16px; border: none; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.12); transition: transform .2s; color: #fff; }
    .cta-topo-btn:active { transform: scale(0.97); }
    .cta-topo-btn i { font-size: 18px; }
    .cta-topo-btn.agendar { background: linear-gradient(135deg, #25D366, #128C7E); }
    .cta-topo-btn.clube { background: linear-gradient(135deg, #C2185B, #7C3AED); }

    .depoimentos-scroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px 8px; padding: 6px 20px 14px; scrollbar-width: none; }
    .depoimentos-scroll::-webkit-scrollbar { display: none; }
    .depoimento-card { flex-shrink: 0; width: 280px; scroll-snap-align: start; background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); border-left: 4px solid var(--cor-dourada); display: flex; flex-direction: column; }
    .depoimento-card .dep-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--cor-principal), var(--cor-dourada)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; overflow: hidden; margin-bottom: 12px; }
    .depoimento-card .dep-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .depoimento-card .dep-nome { font-size: 15px; font-weight: 700; color: var(--cor-principal); margin-bottom: 4px; }
    .depoimento-card .dep-estrelas { color: #F5A623; font-size: 13px; margin-bottom: 10px; letter-spacing: 2px; }
    .depoimento-card .dep-texto { font-size: 13px; color: #555; line-height: 1.6; font-style: italic; flex: 1; }

    .planos-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px 8px; padding: 6px 20px 14px; scrollbar-width: none; }
    .planos-scroll::-webkit-scrollbar { display: none; }
    .plano-card { flex-shrink: 0; width: 200px; scroll-snap-align: start; background: #fff; border: 1.5px solid rgba(157, 23, 77, 0.12); border-radius: 20px; padding: 20px 15px; position: relative; box-shadow: 0 4px 14px rgba(0,0,0,0.05); cursor: pointer; display: flex; flex-direction: column; }
    .plano-card.destaque { border-color: var(--cor-dourada); background: linear-gradient(160deg, #FFFCF2, #FFF2F6); }
    .plano-card.master-gold { border: 2px solid var(--cor-dourada); background: linear-gradient(160deg, #FFFCF2, #FFF2F6); position: relative; overflow: hidden; }
    .plano-card.master-gold::before { content: ''; position: absolute; top: -30%; right: -30%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(212,175,55,0.2), transparent 70%); border-radius: 50%; }
    .plano-badge { position: absolute; top: -10px; left: 12px; background: var(--cor-dourada); color: #fff; font-size: 9px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; }
    .master-ai-badge { display: inline-flex; align-items: center; gap: 5px; background: linear-gradient(135deg, #7C3AED, #D4AF37); color: #fff; font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; letter-spacing: 0.5px; position: relative; z-index: 1; }
    .plano-nome { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--cor-principal); font-weight: 700; display: block; margin-bottom: 4px; }
    .plano-preco { font-size: 22px; font-weight: 700; color: var(--cor-texto-escuro); display: block; margin-bottom: 12px; }
    .plano-preco small { font-size: 11px; color: var(--cor-texto-mutado); font-weight: 600; }
    .plano-features { list-style: none; font-size: 11px; color: var(--cor-texto-mutado); line-height: 1.6; margin-bottom: 16px; flex: 1; }
